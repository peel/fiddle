[package]
name = "fiddle-runtime"
version.workspace = true
edition.workspace = true

[features]
contract-harness = []
gh-stub = []
git-stub = []
wiz-stub = []
go-stub = []
check-stub = []

[[bin]]
name = "gh_stub"
path = "tests/gh_stub/gh_stub.rs"
required-features = ["gh-stub"]
test = false
doc = false

[[bin]]
name = "git_stub"
path = "tests/git_stub/git_stub.rs"
required-features = ["git-stub"]
test = false
doc = false

[[bin]]
name = "wiz_stub"
path = "tests/wiz_stub/wiz_stub.rs"
required-features = ["wiz-stub"]
test = false
doc = false

[[bin]]
name = "go_stub"
path = "tests/go_stub/go_stub.rs"
required-features = ["go-stub"]
test = false
doc = false

[[bin]]
name = "check_stub"
path = "tests/check_stub/check_stub.rs"
required-features = ["check-stub"]
test = false
doc = false

[[test]]
name = "support"
path = "tests/support/support.rs"

[dependencies]
fiddle-core = { path = "../fiddle-core" }
fiddle-macros = { path = "../fiddle-macros" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rig-core.workspace = true
rig-agent.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
base64.workspace = true
schemars.workspace = true
time.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
trybuild.workspace = true
fiddle-runtime = { path = ".", features = [
  "contract-harness",
  "gh-stub",
  "git-stub",
  "wiz-stub",
  "go-stub",
  "check-stub",
] }
