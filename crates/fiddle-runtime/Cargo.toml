[package]
name = "fiddle-runtime"
version.workspace = true
edition.workspace = true

# The port contract is stated against the traits, not against the stubs, so a
# later real adapter living outside this crate can run the same harness. It is
# compiled for this crate's own tests unconditionally and exported to other
# crates behind this feature.
[features]
contract-harness = []

[dependencies]
fiddle-core = { path = "../fiddle-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The impure side of the boundary. These live here and in no other crate: the
# crate_boundary acceptance test walks fiddle-core's resolved closure and fails
# if any of them becomes reachable from the pure domain. Nothing consumes them
# yet; the later M1 tasks that build the Rig capability do.
rig-core.workspace = true
rig-agent.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
schemars.workspace = true

# One call: `killpg`, so a timed-out check takes its whole process group with it
# rather than only the process this runtime holds a handle to. There is no std
# API for signalling a group, and `kill_on_drop` reaps the direct child alone —
# which is not enough for a `cargo test` that has already spawned test binaries.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
