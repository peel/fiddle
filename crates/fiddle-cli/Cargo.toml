[package]
name = "fiddle-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fiddle"
path = "src/main.rs"

[dependencies]
fiddle-core = { path = "../fiddle-core" }
fiddle-runtime = { path = "../fiddle-runtime" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# `fancy` pulls in the graphical report handler, which renders the offending
# source line and caret that design §4.6 requires of a configuration error.
miette = { workspace = true, features = ["fancy"] }
thiserror.workspace = true

# Only the exit-code table's tests reach for a filesystem: they drive a real
# attempt over a fixture root so the code they pin is the code a real conclusion
# produces, rather than one hand-written beside the mapping it is checking.
[dev-dependencies]
tempfile.workspace = true
