name: github-effects
run-name: github-effects ${{ inputs.fiddle_effect_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      fiddle_effect_id:
        description: "Effect id, echoed into run-name so a dispatch can be found again"
        required: false
permissions:
  contents: read
concurrency:
  group: github-effects-${{ inputs.fiddle_effect_id || github.run_id }}
  cancel-in-progress: false
jobs:
  effects:
    runs-on: ubuntu-latest
    steps:
      - name: Require FIDDLE_EFFECTS_TOKEN — fail loudly, never skip
        env:
          FIDDLE_EFFECTS_TOKEN: ${{ secrets.FIDDLE_EFFECTS_TOKEN }}
        run: |
          if [ -z "${FIDDLE_EFFECTS_TOKEN:-}" ]; then
            echo "::error title=github-effects: FIDDLE_EFFECTS_TOKEN is not set::This lane fails rather than skips, because a silently-skipped lane is indistinguishable from a passing one."
            {
              echo "github-effects needs the repository secret FIDDLE_EFFECTS_TOKEN."
              echo
              echo "  What it must be: a fine-grained personal access token whose repository"
              echo "  selection is peel/fiddle-effects-acceptance and nothing else, with"
              echo "  Metadata at read, Contents, Pull requests and Actions at read and write,"
              echo "  and no Secrets permission at all."
              echo
              echo "  Actions is the one that is easy to get wrong. Contents pushes the branch,"
              echo "  Pull requests opens the pull request, and Actions: write is what"
              echo "  POST /repos/{repo}/actions/workflows/{file}/dispatches requires — so a 403"
              echo "  on the dispatch is Actions missing. It is NOT Workflows: that permission"
              echo "  governs pushes touching .github/workflows/**, which is how the target's"
              echo "  own fiddle-check.yml was installed and is something this lane never does."
              echo "  Granting Workflows in place of Actions leaves the dispatch still 403 and"
              echo "  hands the credential the authority to rewrite the target's CI."
              echo "  See docs/technical/effects-repository.md."
              echo
              echo "  Where it goes: Settings -> Secrets and variables -> Actions on this"
              echo "  repository, as an Actions secret named FIDDLE_EFFECTS_TOKEN:"
              echo "    gh secret set FIDDLE_EFFECTS_TOKEN --repo ${GITHUB_REPOSITORY} < token.txt"
              echo
              echo "  Why not the job's GITHUB_TOKEN: it is scoped to ${GITHUB_REPOSITORY} and"
              echo "  cannot write to another repository whatever this workflow's permissions"
              echo "  block says. See this file's header."
            } >&2
            exit 1
          fi
          echo "FIDDLE_EFFECTS_TOKEN is present. Its value is never printed or logged."
      - uses: actions/checkout@v4
      - name: Require a Cargo workspace on the dispatched ref — fail before the build
        run: |
          if [ -f Cargo.toml ]; then
            echo "Cargo workspace manifest present at the checkout root for ${GITHUB_REF} (${GITHUB_SHA}). Continuing."
            exit 0
          fi
          echo "::error title=github-effects: the dispatched ref carries no Cargo workspace::This lane builds the fiddle binary, so a ref with no Cargo.toml at its root cannot run it. Re-dispatch with --ref <milestone-branch>."
          {
            echo "github-effects was dispatched against a ref that has no Cargo.toml at its root."
            echo
            echo "  Ref:        ${GITHUB_REF}"
            echo "  Commit:     ${GITHUB_SHA}"
            echo "  Checkout:   ${GITHUB_WORKSPACE}"
            echo
            echo "  Why this fails: this lane runs the M2 GitHub-effect walk through the"
            echo "  compiled binary, so it must build the Rust workspace first. Without a"
            echo "  Cargo.toml at the checkout root there is nothing to build, and cargo"
            echo "  would answer 'could not find Cargo.toml in ${GITHUB_WORKSPACE}' forty"
            echo "  lines into a build log instead of naming the actual problem here."
            echo
            echo "  Why the ref and not this file: actions/checkout above is bare, so the"
            echo "  ref you dispatch decides which code is checked out. The workflow entity"
            echo "  has to live on the default branch because that is where"
            echo "  workflow_dispatch resolves entities, but the ref is a dispatch-time"
            echo "  argument. One entity on main therefore serves every milestone and this"
            echo "  file never needs repointing."
            echo
            echo "  What to pass instead: a ref carrying BOTH the Rust workspace and this"
            echo "  workflow file. That is a smaller set than it sounds — main has this file"
            echo "  and no workspace, plan/agentic-factory-m0 and -m1 have the workspace and"
            echo "  not this file — and today it is exactly one ref:"
            echo
            echo "    gh workflow run github-effects.yml --repo ${GITHUB_REPOSITORY} \\"
            echo "      --ref ci/github-effects-dispatch-proof"
            echo
            echo "  main will not carry a Cargo workspace until the milestone stack merges."
            echo "  After that merge --ref main works, is the right thing to pass, and the"
            echo "  branch above can go. Before it, that branch is the only thing that works,"
            echo "  which is why it is named here rather than a milestone branch that is not"
            echo "  pushed: a command offered in an error message has to be one that runs."
          } >&2
          exit 1
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1" }
      - run: cargo build --release
      - name: M2 GitHub-effect walk (live, credentialed, never part of the gate)
        env:
          FIDDLE_GITHUB_TOKEN: ${{ secrets.FIDDLE_EFFECTS_TOKEN }}
        run: FIDDLE_BIN="$PWD/target/release/fiddle" scripts/live-github.sh
