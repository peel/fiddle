# CI deliberately does NOT run `nix flake check`: inputs.ai-devtools is path:/Users/peel/wrk/ai-devtools,
# which exists on no runner and has no substitute providing flakeModules.ai-tools. See Task 0 Step 4.
# `nix flake check` therefore stays the local-only developer gate, and CI runs the same four Cargo
# commands directly against the channel pinned by rust-toolchain.toml.
name: rust
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.85.0", components: "rustfmt, clippy" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Named separately from the workspace test run so the milestone proof is
      # visible in the job log rather than buried in it. The scenario needs no
      # credentials: it removes GITHUB_TOKEN, GH_TOKEN, ANTHROPIC_API_KEY, and
      # JIRA_API_TOKEN from every subprocess it launches, so this job never
      # needs a secret and works unchanged on a fork. Documented as the M0
      # acceptance command in docs/technical/SYSTEM.md.
      - name: M0 acceptance scenario (credential-free black-box)
        run: cargo test -p fiddle-acceptance --test m0_skeleton -- --nocapture
      - run: cargo build --release
