version = 1
name = "toil"
stage = "toil"

# The eligible path of the toil implementer, RFC requirement 21.
#
# The gate runs in Rust after `selected_workflow` loads the document and before
# the workflow runs. A run that reaches these steps has already been qualified,
# so nothing here decides whether the run should have started.

# Read the direction a person left on the pull request this ticket already has,
# when it has one. A review that is not an approval, from somebody the project
# entitles, written against the head the pull request now carries, is what the
# agent below is asked to act on. A bot the reviewer names by account is read
# with it, because a reviewer who writes "Claude's comment 1 and 2" is pointing
# at something the run has to be able to see. A ticket with no open pull request
# steers nothing and the step passes through.
[[steps]]
kind = "steer"

# quickfix_change. The agent makes the bounded change the ticket asked for and
# runs the check this project declares, through the `run_check` tool.
[[steps]]
kind = "agent"
prompt = "toil.md"
max_turns = 160

# The shared change_evaluate. It reads the project and answers a typed verdict.
# A rejection stops every step below and the run reports a refusal, which is the
# RFC's `NoChange EvaluationRejected` arm.
[[steps]]
kind = "evaluate"
prompt = "change_evaluate.md"
max_turns = 60

[[steps]]
kind = "commit"

# Push the marked branch.
[[steps]]
kind = "effect"
name = "ensure_branch_published"

# Open the pull request on it.
[[steps]]
kind = "effect"
name = "ensure_pull_request"

# Link that pull request onto the ticket. The number comes from the step above,
# and the issue key and revision come from the work item the run observed.
[[steps]]
kind = "effect"
name = "jira.pull_request_linked"

# Set the ticket to In Review, which is where the RFC leaves it once the pull
# request is open. `reaching` names the status this site calls that state; the
# effect reads the issue first and writes nothing when it is already there. A
# site whose workflow offers no route to that status fails this step, and the
# run reports a failure rather than a completion that left the ticket behind.
[[steps]]
kind = "effect"
name = "jira.issue_transitioned"
reaching = "In Review"
