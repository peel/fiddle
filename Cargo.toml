[workspace]
resolver = "2"
members = [
  "crates/fiddle-core",
  "crates/fiddle-runtime",
  "crates/fiddle-cli",
  "crates/fiddle-acceptance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
regex = "1"
