[workspace]
resolver = "2"
members = [
  "crates/fiddle-core",
  "crates/fiddle-macros",
  "crates/fiddle-runtime",
  "crates/fiddle-cli",
  "crates/fiddle-acceptance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
miette = "7"
thiserror = "2"
blake3 = "1"
base64 = "0.22"
assert_cmd = "2"
regex = "1"
tempfile = "3"
trybuild = "1"
syn = "2"
quote = "1"
proc-macro2 = "1"

rig-core = { version = "=0.41.0", features = ["derive", "test-utils"] }
rig-agent = "=0.41.0"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
schemars = "1"
