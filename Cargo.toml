[workspace]
resolver = "2"
members = [
  "crates/fiddle-core",
  "crates/fiddle-runtime",
  "crates/fiddle-cli",
  "crates/fiddle-acceptance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
miette = "7"
thiserror = "2"
blake3 = "1"
assert_cmd = "2"
regex = "1"
tempfile = "3"

# Rig is pinned exactly, not caret-ranged: it ships breaking agent and tool API
# changes across minor releases, so moving off 0.41.0 must be a deliberate
# review rather than something `cargo update` does on its way past. rig-agent is
# a separate crate because 0.41 moved Agent/AgentBuilder/AgentRun out of
# rig-core; both belong to fiddle-runtime and to no other crate.
rig-core = { version = "=0.41.0", features = ["derive", "test-utils"] }
rig-agent = "=0.41.0"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
tokio-util = "0.7"
schemars = "1"
